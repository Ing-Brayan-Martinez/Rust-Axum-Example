[package]
name = "Rust-Axum-Example"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "chrono", "rust_decimal", "uuid"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rx-rust = { version = "2.0", features = ["tokio-scheduler"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
log = "0.4.35"